<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A four-chart D3.js data visualisation page for COS30045 T05.">
  <title>D3 charts dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
  <header class="page-header">
    <div class="page-header__content">
      <p class="course-label">COS30045 · T05</p>
      <h1>D3 MULTI-CHARTS DASHBOARD</h1>
    </div>
  </header>

  <main class="page-content">
    <div class="chart-grid">
      <section class="chart-section" aria-labelledby="scatter-title">
        <h2 id="scatter-title">Scatter Plot</h2>
        <div id="scatter-plot" class="chart-placeholder"></div>
      </section>

      <section class="chart-section" aria-labelledby="donut-title">
        <h2 id="donut-title">Donut Chart</h2>
        <div id="donut-chart" class="chart-placeholder"></div>
      </section>

      <section class="chart-section" aria-labelledby="bar-title">
        <h2 id="bar-title">Bar Chart</h2>
        <div id="bar-chart" class="chart-placeholder"></div>
      </section>

      <section class="chart-section" aria-labelledby="line-title">
        <h2 id="line-title">Line Chart</h2>
        <div id="line-chart" class="chart-placeholder" role="img" aria-label="Line chart placeholder"></div>
      </section>
    </div>
  </main>
  <script src="js/scatter.js"></script>
  <script src="js/donut.js"></script>
  <script src="js/bar.js"></script>
</body>
</html>
